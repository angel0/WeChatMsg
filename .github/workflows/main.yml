name: Build WeChatMsg EXE on Windows

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements_pc.txt) {
            pip install -r requirements_pc.txt
          }
          elseif (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          else {
            pip install pyinstaller
          }

      - name: 使用 PyInstaller 打包
        shell: pwsh
        run: |
          pip install pyinstaller
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path WeChatMsg.spec) { Remove-Item -Force WeChatMsg.spec }

          pyinstaller --noconfirm --clean --onefile --windowed `
            --add-data "exporter;exporter" `
            --add-data "wxManager;wxManager" `
            --add-data "app/data/avatar;app/data/avatar" `
            --add-data "app/data/image2;app/data/image2" `
            --icon "logo.ico" `
            main_pc.py

      - name: 压缩并上传可执行文件
        shell: pwsh
        run: |
          if (-not (Test-Path dist/main_pc.exe)) {
            Write-Error "打包失败，没有找到 dist/main_pc.exe"
            exit 1
          }
          Compress-Archive -Path dist/main_pc.exe -DestinationPath WeChatMsg.zip -Force

      - name: 上传 Artifact (Zip 包)
        uses: actions/upload-artifact@v4
        with:
          name: WeChatMsg_windows
          path: WeChatMsg.zip
